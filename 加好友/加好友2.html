<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>微信加好友助手</title>
<style>
:root{
  --line:rgba(255,255,255,.13);
  --txt:#e8eefc;
  --muted:#8b9bb4;
  --green:#22c55e;
  --blue:#38bdf8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt);
  min-height:100vh;
  background:#0b1220;
  background-image:
    radial-gradient(700px 420px at 8% -6%, rgba(56,189,248,.28), transparent 62%),
    radial-gradient(620px 420px at 104% 8%, rgba(168,85,247,.24), transparent 62%),
    radial-gradient(760px 520px at 50% 112%, rgba(34,197,94,.20), transparent 62%),
    linear-gradient(180deg,#0b1220 0%,#0e1626 55%,#0b1220 100%);
  background-attachment:fixed;
  padding-bottom:calc(148px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶部 ---------- */
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(11,18,32,.75);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top h1{
  margin:0 0 10px;font-size:15px;font-weight:600;letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;color:#fff;
}
.top h1::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--green);box-shadow:0 0 10px var(--green);
  animation:blink 2s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.stats{display:flex;gap:8px;}
.stat{
  flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:12px;padding:7px 4px;text-align:center;
}
.stat b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.25;}
.stat span{font-size:10.5px;color:var(--muted);}
.progress{height:4px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden;}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#38bdf8,#22c55e);transition:width .35s;}

/* ---------- 列表 ---------- */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;padding:14px;
}
.card{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:18px 6px 14px;
  border-radius:16px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:var(--txt);
  font-size:16.5px;font-weight:600;letter-spacing:.6px;
  font-variant-numeric:tabular-nums;
  transition:transform .12s,background .25s,border-color .25s,color .25s;
  cursor:pointer;overflow:hidden;
  font-family:inherit;
}
.card:active{transform:scale(.955);}
.card .idx{
  position:absolute;top:6px;left:9px;
  font-size:10px;font-weight:500;color:var(--muted);
}
.card.done{
  background:linear-gradient(160deg,rgba(34,197,94,.32),rgba(16,185,129,.14));
  border-color:rgba(34,197,94,.55);
  color:#d9ffe8;
}
.card.done::after{
  content:'已复制';position:absolute;top:6px;right:9px;
  font-size:10px;font-weight:500;color:#86efac;
}
.card.pop{animation:pop .28s;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);
  font-size:14px;line-height:2;padding:70px 20px;
}

/* ---------- 底部操作栏 ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(11,18,32,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
}
.row{display:flex;gap:8px;}
.btn{
  flex:1;border:1px solid var(--line);border-radius:14px;
  padding:13px 8px;font-size:15px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.09);
  transition:transform .1s,opacity .2s;
  font-family:inherit;cursor:pointer;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.32;}
.btn.primary{background:linear-gradient(135deg,#0ea5e9,#22c55e);border-color:transparent;box-shadow:0 6px 18px rgba(14,165,233,.28);}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:transparent;}
.btn.mini{font-size:12px;padding:9px 4px;font-weight:500;color:var(--muted);background:rgba(255,255,255,.05);flex:1;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:rgba(20,30,48,.96);border:1px solid var(--line);
  color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
  transition:all .25s;z-index:60;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 通用弹窗 ---------- */
.modal{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.62);
}
.modal.show{display:flex;}
.modal-box{
  width:100%;max-width:480px;background:#131c2e;
  border:1px solid var(--line);border-radius:20px;padding:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal-box h2{margin:0 0 6px;font-size:16px;color:#fff;}
.modal-box p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.6;}
textarea{
  width:100%;height:150px;background:#0b1220;color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:10px;
  font-size:13px;resize:vertical;font-family:inherit;outline:none;line-height:1.6;
}
textarea:focus{border-color:rgba(56,189,248,.6);}
.modal-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.modal-btns .btn{flex:1 1 44%;font-size:14px;padding:11px 8px;}
.hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;}

/* ---------- 手动复制弹窗 ---------- */
.manual-mask{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}
.manual-mask.show{display:flex}
.manual-box{width:100%;max-width:460px;background:#131c2e;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.manual-box h3{margin:0 0 8px;font-size:16px;color:#fff}
.manual-box p{margin:0 0 10px;font-size:12px;color:#8b9bb4;line-height:1.7}
.manual-ta{width:100%;height:120px;background:#0b1220;color:#e8eefc;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;line-height:1.7;outline:none;resize:none;white-space:pre;overflow:auto;-webkit-user-select:text;user-select:text}
.manual-ta:focus{border-color:#38bdf8}
.manual-btns{display:flex;gap:8px;margin-top:12px}
.manual-btns .btn{flex:1;font-size:14px;padding:11px 8px}

/* ---------- 导出弹窗 ---------- */
.export-mask{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}
.export-mask.show{display:flex}
.export-box{width:100%;max-width:460px;background:#131c2e;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.export-box h3{margin:0 0 6px;font-size:16px;color:#fff}
.export-info{font-size:12px;color:#8b9bb4;line-height:1.7;margin:0 0 10px}
.export-ta{width:100%;height:180px;background:#0b1220;color:#e8eefc;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;font-size:14px;font-family:inherit;line-height:1.7;outline:none;resize:none;white-space:pre;overflow:auto;-webkit-user-select:text;user-select:text}
.export-ta:focus{border-color:#38bdf8}
.export-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.export-btns .btn{flex:1 1 44%;font-size:13.5px;padding:11px 8px}
</style>
</head>
<body>

<div class="top">
  <h1>微信加好友助手</h1>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>总号码</span></div>
    <div class="stat"><b id="sDone">0</b><span>已复制</span></div>
    <div class="stat"><b id="sPage">1/1</b><span>当前批次</span></div>
  </div>
  <div class="progress"><i id="pbar" style="width:0%"></i></div>
</div>

<main id="list" class="grid"></main>

<div id="toast"></div>

<div class="bar">
  <div class="row">
    <button class="btn" id="btnPrev">上一批</button>
    <button class="btn primary" id="btnCopyAll">复制本批</button>
    <button class="btn" id="btnNext">下一批</button>
  </div>
  <div class="row">
    <button class="btn mini" id="btnImport">导入</button>
    <button class="btn mini" id="btnExport">导出</button>
    <button class="btn mini" id="btnReset">重置进度</button>
    <button class="btn mini" id="btnJump">跳到最后</button>
  </div>
</div>

<!-- 导入弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>导入号码</h2>
    <p>把整份 txt 内容直接粘进来即可，会自动提取所有手机号并去重，同时记住每个号码所在的原始行（带姓名、备注等），方便以后导出。</p>
    <textarea id="importText" placeholder="粘贴任意内容，例如：&#10;19973327315,&#10;13032102408,&#10;..."></textarea>
    <div class="hint" id="importHint"></div>
    <div class="modal-btns">
      <button class="btn" id="btnFile">选择文件</button>
      <button class="btn primary" id="btnAppend">追加导入</button>
      <button class="btn warn" id="btnReplace">覆盖导入</button>
      <button class="btn" id="btnClose">关闭</button>
    </div>
    <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
  </div>
</div>

<!-- 手动复制弹窗 -->
<div class="manual-mask" id="manualMask">
  <div class="manual-box">
    <h3 id="manualTitle">手动复制</h3>
    <p>自动复制未成功，请按下面操作：<br>① 点「全选」<br>② 长按输入框 → 选择「复制」</p>
    <textarea class="manual-ta" id="manualTa" readonly></textarea>
    <div class="manual-btns">
      <button class="btn" id="manualSelect">全选</button>
      <button class="btn primary" id="manualClose">关闭</button>
    </div>
  </div>
</div>

<!-- 导出弹窗 -->
<div class="export-mask" id="exportMask">
  <div class="export-box">
    <h3>导出已加号码</h3>
    <div class="export-info" id="exportInfo"></div>
    <textarea class="export-ta" id="exportTa" readonly></textarea>
    <div class="export-btns">
      <button class="btn" id="exportSelectAll">全选</button>
      <button class="btn primary" id="exportCopy">复制</button>
      <button class="btn" id="exportDownload">下载txt</button>
      <button class="btn" id="exportClose">关闭</button>
    </div>
  </div>
</div>

  /* ==================== 状态 ==================== */

  function toast(msg) {
    toastEl.textContent = msg;

    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');

  /* 解析原始文本：按行拆分，每行提取所有号码
     - 返回 [{num, line}]
     - 同一行多个号码共享同一行原文
     - 全局去重，保留首次出现的行 */
  function parseEntries(text) {
    var seen = Object.create(null);
    var out = [];
    var lines = String(text || '').split(/\r?\n/);

    for (var li = 0; li < lines.length; li++) {
      var line = lines[li].trim();
      if (!line) continue;

      var re = /1[3-9]\d{9}/g;
      var m;
      while ((m = re.exec(line)) !== null) {
        var i = m.index;
        var n = m[0];
        var before = line.charAt(i - 1);
        var after = line.charAt(i + 11);
        if (before && /\d/.test(before)) continue;
        if (after && /\d/.test(after)) continue;
        if (seen[n]) continue;
        seen[n] = 1;
        out.push({ num: n, line: line });
      }
    }
    return out;
  }

  /* ==================== 复制（移动端可靠版） ==================== */
  function syncCopy(text) {
    if (!text) return false;

    var ta = document.createElement('textarea');
    ta.style.cssText = [
      'position:fixed', 'top:0', 'left:0',
      'width:100%', 'height:100%',
      'padding:0', 'margin:0', 'border:0', 'outline:0',
      'box-shadow:none', 'background:transparent',
      'color:transparent', 'caret-color:transparent',
      'font-size:16px', 'opacity:0.01', 'z-index:999999'
    ].join(';');
    document.body.appendChild(ta);

    ta.contentEditable = 'true';
    ta.readOnly = false;
    ta.value = text;

    var ok = false;
    try {
      ta.focus();
      var range = document.createRange();
      range.selectNodeContents(ta);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e1) {
      try {
        ta.select();
        ta.setSelectionRange(0, text.length);
        ok = document.execCommand('copy');
      } catch (e2) {
        ok = false;
      }
    }

    document.body.removeChild(ta);
    return ok;
  }

  function openManual(text, title) {
    var mask = document.getElementById('manualMask');
    var ta = document.getElementById('manualTa');
    ta.value = text;
    document.getElementById('manualTitle').textContent = title || '手动复制';
    mask.classList.add('show');
    setTimeout(function () {
      try {
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
      } catch (e) {}
    }, 80);
  }

  function copyText(text) {
    if (!text) return Promise.resolve('empty');

    if (syncCopy(text)) return Promise.resolve('auto');

    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () {
        return 'auto';
      }).catch(function () {
        return 'manual';
      });
    }

    return Promise.resolve('manual');
  }

  function downloadText(filename, text) {
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { document.body.removeChild(a); } catch (e) {}
        try { URL.revokeObjectURL(url); } catch (e) {}
      }, 300);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ==================== 持久化 ==================== */
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        numbers: state.numbers,
        rawMap: state.rawMap,
        page: state.page,
        copied: state.copied
      }));
    } catch (e) {
      console.warn('保存失败', e);
    }
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.numbers) || d.numbers.length === 0) return false;
      state.numbers = d.numbers;
      state.rawMap = (d.rawMap && typeof d.rawMap === 'object') ? d.rawMap : {};
      state.page = parseInt(d.page, 10) || 0;
      state.copied = (d.copied && typeof d.copied === 'object') ? d.copied : {};
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ==================== 数据操作 ==================== */
  function appendEntries(entries) {
    var exists = Object.create(null);
    for (var i = 0; i < state.numbers.length; i++) exists[state.numbers[i]] = 1;

    var added = 0;
    for (var j = 0; j < entries.length; j++) {
      var e = entries[j];
      if (!exists[e.num]) {
        exists[e.num] = 1;
        state.numbers.push(e.num);
        state.rawMap[e.num] = e.line;
        added++;
      } else if (!state.rawMap[e.num]) {
        // 旧数据没有原始行，补上
        state.rawMap[e.num] = e.line;
      }
    }
    return added;
  }

  function replaceEntries(entries) {
    state.numbers = [];
    state.rawMap = {};
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      state.numbers.push(e.num);
      state.rawMap[e.num] = e.line;
    }
    state.page = 0;
    state.copied = {};
  }

  /* ==================== 渲染 ==================== */
  function totalPages() {
    return Math.max(1, Math.ceil(state.numbers.length / PAGE_SIZE));
  }

  function render() {
    var pages = totalPages();
    if (state.page > pages - 1) state.page = pages - 1;
    if (state.page < 0) state.page = 0;

    var start = state.page * PAGE_SIZE;
    var slice = state.numbers.slice(start, start + PAGE_SIZE);

    listEl.innerHTML = '';

    if (slice.length === 0) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.innerHTML = '还没有号码<br>点下面的「导入」粘贴号码';
      listEl.appendChild(d);
    } else {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < slice.length; i++) {
        var num = slice[i];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'card' + (state.copied[num] ? ' done' : '');
        b.dataset.num = num;

        var idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = start + i + 1;

        var nm = document.createElement('span');
        nm.className = 'num';
        nm.textContent = num;

        b.appendChild(idx);
        b.appendChild(nm);
        frag.appendChild(b);
      }
      listEl.appendChild(frag);
    }

    updateStats();
  }

  function updateStats() {
    var pages = totalPages();
    var start = state.page * PAGE_SIZE;
    var sliceLen = Math.min(PAGE_SIZE, Math.max(0, state.numbers.length - start));

    var done = 0;
    for (var i = 0; i < state.numbers.length; i++) {
      if (state.copied[state.numbers[i]]) done++;
    }

    document.getElementById('sTotal').textContent = state.numbers.length;
    document.getElementById('sDone').textContent = done;
    document.getElementById('sPage').textContent = (state.page + 1) + '/' + pages;
    document.getElementById('pbar').style.width =
      (state.numbers.length ? ((state.page + 1) / pages * 100) : 0).toFixed(1) + '%';

    document.getElementById('btnPrev').disabled = state.page <= 0;
    document.getElementById('btnNext').disabled = state.page >= pages - 1;
    document.getElementById('btnCopyAll').textContent = '复制本批(' + sliceLen + ')';
  }

  /* ==================== 卡片点击 ==================== */
  listEl.addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) return;

    var num = card.dataset.num;

    copyText(num).then(function (result) {
      if (result === 'manual') {
        openManual(num, '手动复制号码');
        return;
      }
      if (result === 'auto') {
        state.copied[num] = 1;
        card.classList.add('done', 'pop');
        setTimeout(function () { card.classList.remove('pop'); }, 280);

        if (navigator.vibrate) { try { navigator.vibrate(18); } catch (err) {} }

        save();
        updateStats();
        toast('已复制 ' + num);
      }
    });
  });

  /* ==================== 分页按钮 ==================== */
  document.getElementById('btnPrev').addEventListener('click', function () {
    if (state.page > 0) {
      state.page--;
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('btnNext').addEventListener('click', function () {
    if (state.page < totalPages() - 1) {
      state.page++;
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

  /* ==================== 复制本批 ==================== */
  document.getElementById('btnCopyAll').addEventListener('click', function () {
    var start = state.page * PAGE_SIZE;
    var slice = state.numbers.slice(start, start + PAGE_SIZE);
    if (slice.length === 0) return;

    var text = slice.join('\n');

    copyText(text).then(function (result) {
      if (result === 'manual') {
        openManual(text, '手动复制本批 ' + slice.length + ' 个号码');
        return;
      }
      if (result === 'auto') {
        for (var i = 0; i < slice.length; i++) state.copied[slice[i]] = 1;
        save();
        render();
        toast('已复制本批 ' + slice.length + ' 个号码');

  /* ==================== 重置 / 跳转 ==================== */
  document.getElementById('btnReset').addEventListener('click', function () {

  /* ==================== 导出已加（原始行） ==================== */
  function buildExport() {
    var lines = [];

    var doneCount = 0;

    for (var i = 0; i < state.numbers.length; i++) {
      var num = state.numbers[i];
      if (!state.copied[num]) continue;
      doneCount++;
      var line = state.rawMap[num] || num;   // 旧数据没有原始行时回退为号码
      if (seenLines[line]) continue;
      seenLines[line] = 1;
      lines.push(line);
    }

    return { lines: lines, doneCount: doneCount };

  function openExport() {

  });

  document.getElementById('exportSelectAll').addEventListener('click', function () {
    var ta = document.getElementById('exportTa');
    try {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
    } catch (e) {}
  });

  document.getElementById('exportCopy').addEventListener('click', function () {
    var ta = document.getElementById('exportTa');
    var text = ta.value;
    if (!text) { toast('没有内容可复制'); return; }

    copyText(text).then(function (result) {
      if (result === 'manual') {
        openManual(text, '手动复制导出内容');
        return;
      }
      if (result === 'auto') toast('已复制到剪贴板');
    });
  });

  document.getElementById('exportDownload').addEventListener('click', function () {
    var ta = document.getElementById('exportTa');
    var text = ta.value;
    if (!text) { toast('没有内容可下载'); return; }

    var d = new Date();
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var filename = '已加号码_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.txt';

    if (downloadText(filename, text)) {
      toast('已开始下载 ' + filename);
    } else {
      toast('下载失败，请点「全选」后手动复制');
    }
  });

  /* ==================== 导入 ==================== */
  function openModal() {
    importTextEl.value = '';
    importHintEl.textContent = '';
    modalEl.classList.add('show');
  }
  function closeModal() {
    modalEl.classList.remove('show');
  }

  document.getElementById('btnImport').addEventListener('click', openModal);
  document.getElementById('btnClose').addEventListener('click', closeModal);
  modalEl.addEventListener('click', function (e) {
    if (e.target === modalEl) closeModal();
  });

  document.getElementById('btnFile').addEventListener('click', function () {
    fileInputEl.click();
  });

  fileInputEl.addEventListener('change', function () {
    var f = fileInputEl.files && fileInputEl.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      importTextEl.value = String(reader.result || '');
      var n = parseEntries(importTextEl.value).length;
      importHintEl.textContent = '文件已读取，解析到 ' + n + ' 个号码';
    };
    reader.readAsText(f, 'utf-8');
    fileInputEl.value = '';
  });

  importTextEl.addEventListener('input', function () {
    var n = parseEntries(importTextEl.value).length;
    importHintEl.textContent = n ? ('已解析 ' + n + ' 个号码') : '';
  });

  document.getElementById('btnAppend').addEventListener('click', function () {
    var entries = parseEntries(importTextEl.value);
    if (!entries.length) { toast('没有识别到手机号'); return; }
    var added = appendEntries(entries);
    save();
    render();
    closeModal();
    toast('已追加 ' + added + ' 个新号码（去重后共 ' + state.numbers.length + ' 个）');
  });

  document.getElementById('btnReplace').addEventListener('click', function () {
    var entries = parseEntries(importTextEl.value);
    if (!entries.length) { toast('没有识别到手机号'); return; }
    if (!confirm('覆盖导入会替换全部号码与进度，确定吗？')) return;
    replaceEntries(entries);
    save();
    render();
    closeModal();
    toast('已覆盖导入 ' + entries.length + ' 个号码');
  });

  /* ==================== 手动复制弹窗事件 ==================== */
  (function () {
    var mask = document.getElementById('manualMask');
    var ta = document.getElementById('manualTa');

    document.getElementById('manualClose').addEventListener('click', function () {
      mask.classList.remove('show');
    });

    mask.addEventListener('click', function (e) {
      if (e.target === mask) mask.classList.remove('show');
    });

    document.getElementById('manualSelect').addEventListener('click', function () {
      try {
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
      } catch (e) {}
    });
  })();

  /* ==================== 启动 ==================== */
  function init() {
    if (!load()) {
      var entries = parseEntries(BUILTIN_RAW);
      replaceEntries(entries);
      save();
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
